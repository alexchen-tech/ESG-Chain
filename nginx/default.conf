upstream laravel {
    server esgchain-api:8080;
}

upstream fastapi {
    server esgchain-ai:8000;
}

upstream vue {
    server esgchain-web:5173;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # 業務 API → Laravel
    location /api/ {
        proxy_pass http://laravel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI API → FastAPI
    location /ai/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支援
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 前端 Vue 3
    location / {
        proxy_pass http://vue;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 供應商 Portal（獨立前端 build，正式上線時對應真實子網域，本機以 Host header 驗證）
server {
    listen 80;
    server_name portal.esgchain.local;

    client_max_body_size 50M;

    # 業務 API → Laravel
    location /api/ {
        proxy_pass http://laravel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI API → FastAPI
    location /ai/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支援
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 前端 Vue 3（供應商 Portal 入口）
    # 注意：proxy_pass 帶 URI（http://vue/portal.html）在 location / 這種前綴比對下，
    # 對非根路徑請求（如 /dashboard、/supplier/portal）會把原始路徑「附加」在
    # /portal.html 後面變成畸形路徑（/portal.htmldashboard），導致 Vite dev server
    # 找不到對應檔案、退回預設的 index.html（等於把供應商 Portal 導去中心廠介面）。
    # 用 rewrite 把請求路徑強制改寫成 /portal.html 本身（不管原始路徑是什麼），
    # 讓 Vue Router 的 history mode 由前端 JS 依 window.location.pathname 接手渲染。
    location / {
        rewrite ^ /portal.html break;
        proxy_pass http://vue;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Vite dev server 靜態資源（HMR client、/src、/@vite 等）需維持原始路徑，不可被 /portal.html 改寫覆蓋
    location ~ ^/(src|node_modules|@vite|@id|@fs|favicon\.ico) {
        proxy_pass http://vue;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
