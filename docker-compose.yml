services:

  # ── 資料庫 ───────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: esgchain-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: esgchain
      MYSQL_USER: esgchain
      MYSQL_PASSWORD: esgchain_secret
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: esgchain-postgres
    environment:
      POSTGRES_DB: esgchain_ai
      POSTGRES_USER: esgchain
      POSTGRES_PASSWORD: esgchain_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esgchain -d esgchain_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: esgchain-redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 業務後端（Laravel）──────────────────────────────
  esgchain-api:
    build:
      context: ./esgchain-api
      dockerfile: Dockerfile
    container_name: esgchain-api
    env_file: ./esgchain-api/.env
    ports:
      - "8081:8080"
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Laravel Queue Worker ───────────────────────────
  esgchain-queue-worker:
    build:
      context: ./esgchain-api
      dockerfile: Dockerfile
    container_name: esgchain-queue-worker
    command: php artisan queue:work redis --tries=3 --max-time=3600
    env_file: ./esgchain-api/.env
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── 計算後端（FastAPI）─────────────────────────────
  esgchain-ai:
    build:
      context: ./esgchain-ai
      dockerfile: Dockerfile
    container_name: esgchain-ai
    env_file: ./esgchain-ai/.env
    ports:
      - "8001:8000"
    volumes:
      - ./esgchain-ai:/app
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker ──────────────────────────────────
  celery-worker:
    build:
      context: ./esgchain-ai
      dockerfile: Dockerfile
    container_name: esgchain-celery
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file: ./esgchain-ai/.env
    volumes:
      - ./esgchain-ai:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ── 前端（Vue 3）───────────────────────────────────
  esgchain-web:
    image: node:20-alpine
    container_name: esgchain-web
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./esgchain-web:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8081
      - VITE_AI_API_BASE_URL=http://localhost:8001

  # ── Nginx 反向代理 ─────────────────────────────────
  nginx:
    image: nginx:1.26-alpine
    container_name: esgchain-nginx
    ports:
      - "8090:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - esgchain-api
      - esgchain-ai
      - esgchain-web

volumes:
  mysql_data:
  postgres_data:
  redis_data:
